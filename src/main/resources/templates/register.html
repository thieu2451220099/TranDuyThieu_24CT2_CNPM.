<!doctype html><html lang="vi"><head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><div class="box"><h1>Tạo tài khoản</h1><p class="error" th:if="${param.error}">Tên tài khoản đã tồn tại.</p><form action="/register" method="post"><label>Họ tên<input name="fullName" required></label><label>Tài khoản<input name="username" required></label><label>Mật khẩu<input type="password" name="password" minlength="6" required></label><button class="primary">Đăng ký</button></form><p>Đã có tài khoản? <a href="/login">Đăng nhập</a></p></div></main></body></html>
