<!doctype html><html lang="vi"><head><meta charset="UTF-8"><title>Đăng nhập</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="auth"><div class="box"><h1>Đăng nhập</h1><p class="success" th:if="${param.registered}">Đăng ký thành công! Vui lòng đăng nhập bằng tài khoản vừa tạo.</p><p class="error" th:if="${param.error}">Sai tài khoản hoặc mật khẩu.</p><form action="/login" method="post"><label>Tài khoản<input name="username" required></label><label>Mật khẩu<input type="password" name="password" required></label><button class="primary">Đăng nhập</button></form><p>Chưa có tài khoản? <a href="/register">Đăng ký</a></p><a href="/">← Về trang chủ</a></div></main></body></html>
